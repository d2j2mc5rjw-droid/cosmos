<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmos · 天体模拟系统</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;}
  #c:active{cursor:grabbing;}
  .glass{background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 38%,rgba(140,160,220,.06));
    backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);
    border-radius:22px;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 16px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07),
      inset 1px 0 0 rgba(255,255,255,.10),inset -1px 0 0 rgba(255,255,255,.10);}
  .glass::before{content:'';position:absolute;border-radius:inherit;pointer-events:none;
    background:radial-gradient(130% 55% at 22% -4%,rgba(255,255,255,.20),transparent 58%);}
  body.lite .glass{backdrop-filter:none;-webkit-backdrop-filter:none;
    background:linear-gradient(150deg,rgba(22,27,42,.92),rgba(14,17,28,.94));
    box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);}
  body.lite .glass::before{display:none;}
  #title{position:fixed;top:16px;left:18px;color:#fff;pointer-events:none;user-select:none;text-shadow:0 1px 10px rgba(0,0,0,.8);z-index:5;}
  #title h1{font-size:17px;font-weight:700;margin:0 0 3px;letter-spacing:.14em;}
  #title p{font-size:11.5px;margin:2px 0;opacity:.6;letter-spacing:.04em;}
  #info{position:fixed;top:96px;left:18px;width:270px;color:#fff;padding:16px 18px 14px;display:flex;flex-direction:column;user-select:none;z-index:6;transform-origin:top left;}
  #info.pop{animation:springIn .55s cubic-bezier(.32,1.35,.36,1);}
  @keyframes springIn{from{opacity:0;transform:scale(.92) translateY(-10px);}to{opacity:1;transform:none;}}
  #info h2{font-size:15px;font-weight:700;margin:0 34px 10px 0;letter-spacing:.04em;}
  #info .chip{position:absolute;top:14px;right:14px;font-size:10px;padding:3px 9px;border-radius:99px;
    background:rgba(255,255,255,.14);border:.5px solid rgba(255,255,255,.28);letter-spacing:.06em;color:rgba(255,255,255,.85);}
  #info .hint{font-size:10.5px;opacity:.55;margin:8px 0 2px;line-height:1.5;}
  #info .rbtn{margin-top:12px;text-align:center;font-size:11px;padding:7px 0;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.18);letter-spacing:.08em;
    transition:transform .12s ease-out,background .15s;}
  #info .rbtn:hover{background:rgba(255,255,255,.17);}
  #info .rbtn:active{transform:scale(.965);}
  #info .aibtn{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px;
    background:linear-gradient(120deg,rgba(110,150,255,.30),rgba(160,110,255,.24));
    border:1px solid rgba(150,170,255,.45);color:#e6edff;font-weight:600;}
  #panel{position:fixed;top:16px;right:16px;width:236px;max-height:min(72vh,560px);display:flex;flex-direction:column;overflow:hidden;color:#fff;z-index:6;}
  #panel header{padding:12px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.85;display:flex;justify-content:space-between;align-items:center;}
  #panel header span{cursor:pointer;opacity:.5;font-size:15px;line-height:1;padding:2px 6px;border-radius:6px;transition:opacity .15s,background .15s;}
  #panel header span:hover{opacity:.9;background:rgba(255,255,255,.1);}
  #list{overflow-y:auto;padding:0 8px 10px;}
  #list::-webkit-scrollbar{width:4px;}#list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
  .item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;
    transition:background .15s,transform .12s ease-out;}
  .item:hover{background:rgba(255,255,255,.08);}
  .item:active{transform:scale(.97);}
  .item.sel{background:rgba(255,255,255,.16);}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;}
  .item .nm{font-size:12.5px;flex:1;}
  .item .tp{font-size:10px;opacity:.5;letter-spacing:.05em;}
  #ctrl{position:fixed;left:18px;bottom:16px;width:250px;color:#fff;padding:14px 16px;user-select:none;z-index:6;}
  .seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2.5px;gap:2px;margin:5px 0 9px;}
  .seg button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.62);font-size:11px;padding:5px 0;border-radius:7px;cursor:pointer;
    font-family:inherit;transition:all .15s;}
  .seg button.on{background:rgba(255,255,255,.92);color:#111;font-weight:600;}
  .seg button:hover:not(.on){color:#fff;background:rgba(255,255,255,.08);}
  .seg button:active{transform:scale(.96);}
  .lbl{display:flex;justify-content:space-between;font-size:11px;opacity:.66;margin:8px 0 4px;letter-spacing:.03em;}
  .lbl b{font-family:ui-monospace,Menlo,monospace;font-weight:500;}
  input[type=range]{-webkit-appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:rgba(255,255,255,.14);box-shadow:inset 0 1px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.14);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;
    margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.15),inset 0 -2px 3px rgba(0,0,0,.12);
    transition:transform .15s cubic-bezier(.3,1.4,.5,1);}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15);}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:#fff;}
  #toggles{display:flex;gap:8px;margin-top:10px;}
  .tgl{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:9px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .12s;letter-spacing:.04em;}
  .tgl.on{background:rgba(120,170,255,.28);border-color:rgba(140,180,255,.55);color:#dceaff;}
  .tgl:hover{background:rgba(255,255,255,.14);}
  .tgl:active{transform:scale(.96);}
  #hud{position:fixed;bottom:16px;right:16px;text-align:right;color:rgba(255,255,255,.72);
    font-family:ui-monospace,Menlo,monospace;font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,.9);user-select:none;line-height:1.75;z-index:5;}
  #hud b{color:#fff;font-weight:500;}
  #err{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#200;color:#f99;padding:16px;font:12px ui-monospace,monospace;
    white-space:pre-wrap;max-width:80vw;max-height:70vh;overflow:auto;border-radius:8px;z-index:90;}
  #boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:#000;color:rgba(255,255,255,.75);letter-spacing:.3em;}
  #bootbtns{display:none;gap:12px;margin-top:22px;letter-spacing:.05em;justify-content:center;}
  #bootbtns button{font-family:inherit;font-size:12.5px;padding:9px 20px;border-radius:12px;cursor:pointer;color:#fff;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.25);transition:transform .12s,background .15s;}
  #bootbtns button:hover{background:rgba(255,255,255,.18);}
  #bootbtns button:active{transform:scale(.95);}
  #bootbtns button.pri{background:linear-gradient(120deg,rgba(110,150,255,.45),rgba(160,110,255,.38));border-color:rgba(150,170,255,.6);}
  #softwarn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;cursor:pointer;
    background:rgba(140,40,40,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:.5px solid rgba(255,150,150,.4);border-radius:99px;padding:6px 16px;
    color:#ffd9d9;font-size:11px;letter-spacing:.05em;}
  body.lite #softwarn{backdrop-filter:none;background:rgba(70,32,32,.92);}
  #aiwrap{position:fixed;right:16px;bottom:64px;width:min(370px,calc(100vw - 32px));max-height:min(62vh,520px);
    display:none;flex-direction:column;overflow:hidden;color:#fff;z-index:30;transform-origin:bottom right;}
  #aiwrap.show{display:flex;animation:springInAI .5s cubic-bezier(.32,1.3,.36,1);}
  @keyframes springInAI{from{opacity:0;transform:scale(.9) translateY(14px);}to{opacity:1;transform:none;}}
  #aihead{display:flex;align-items:center;gap:9px;padding:13px 16px 9px;}
  #aihead .spark{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#5f7cff,#a06bff);font-size:12px;}
  #aihead .t{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #aihead span{cursor:pointer;opacity:.5;font-size:13px;line-height:1;padding:3px 7px;border-radius:6px;transition:opacity .15s,background .15s;}
  #aihead span:hover{opacity:.95;background:rgba(255,255,255,.1);}
  #aibody{overflow-y:auto;padding:2px 16px 12px;font-size:12px;line-height:1.75;opacity:.92;white-space:pre-wrap;}
  #aibody::-webkit-scrollbar{width:4px;}#aibody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
  #aibody .caret{display:inline-block;width:7px;height:13px;background:rgba(200,215,255,.85);vertical-align:-2px;
    margin-left:2px;animation:blink 1s steps(1) infinite;border-radius:1.5px;}
  @keyframes blink{50%{opacity:0;}}
  #aisrc{padding:0 16px 8px;font-size:9.5px;opacity:.4;letter-spacing:.06em;}
  #aiset{display:none;padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.09);}
  #aiset .row{display:flex;gap:6px;margin-top:6px;}
  #aiset input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.2);border-radius:8px;
    color:#fff;font-size:11px;padding:6px 9px;font-family:inherit;outline:none;}
  #aiset input:focus{border-color:rgba(140,170,255,.6);}
  #aiset .save{flex:none;width:auto;padding:0 14px;background:rgba(120,160,255,.3);border:1px solid rgba(150,175,255,.5);
    border-radius:8px;color:#e8eeff;font-size:11px;cursor:pointer;font-family:inherit;}
  #aiset .save:active{transform:scale(.96);}
  #aiset .hint{font-size:9.5px;opacity:.45;margin-top:6px;line-height:1.5;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    #aibody .caret{animation:none;opacity:.7;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>Cosmos · <span data-i="appname">天体模拟系统</span></h1>
  <p data-i="subtitle">广义相对论 · 引力透镜 · 爱因斯坦-罗森桥</p>
  <p data-i="helphint">拖动旋转 · 滚轮缩放 · WASD 平移 · 点击选中星体</p>
</div>
<div id="info" class="glass"></div>
<div id="panel" class="glass">
  <header><span data-i="bodylist">天体列表</span><span id="fold">—</span></header>
  <div id="list"></div>
</div>
<div id="ctrl" class="glass">
  <div class="lbl"><span data-i="lang">语言 Language</span></div>
  <div class="seg" id="lang">
    <button data-l="zh">中文</button><button data-l="en">English</button>
  </div>
  <div class="lbl"><span data-i="metric">黑洞度规</span><b id="mtag">克尔</b></div>
  <div class="seg" id="metric">
    <button data-m="0" data-i="m0">史瓦西</button><button data-m="1" data-i="m1">R-N</button>
    <button data-m="2" class="on" data-i="m2">克尔</button><button data-m="3" data-i="m3">克尔-纽曼</button>
  </div>
  <div class="lbl"><span data-i="spin">自旋 a</span><b id="av">0.85</b></div>
  <input type="range" id="spin" min="0" max="0.95" step="0.01" value="0.85">
  <div class="lbl"><span data-i="charge">电荷 Q</span><b id="qv">0.00</b></div>
  <input type="range" id="chg" min="0" max="0.9" step="0.01" value="0">
  <div class="lbl"><span data-i="resq">渲染精度</span><b id="rv">45%</b></div>
  <input type="range" id="resq" min="10" max="100" step="5" value="45">
  <div class="lbl"><span data-i="steps">光线步进</span><b id="sv">200</b></div>
  <input type="range" id="steps" min="40" max="240" step="20" value="200">
  <div class="lbl"><span data-i="expo">曝光</span><b id="ev">1.00</b></div>
  <input type="range" id="expo" min="40" max="220" step="5" value="100">
  <div class="lbl"><span data-i="tscale">时间流速</span><b id="tv">1.0×</b></div>
  <input type="range" id="tscale" min="0" max="400" step="10" value="100">
  <div id="toggles">
    <div class="tgl" id="twhite" data-i="white">白洞形态</div>
    <div class="tgl" id="tbridge" data-i="bridge">罗森桥</div>
    <div class="tgl" id="tlite" data-i="lite">流畅模式</div>
  </div>
</div>
<div id="hud"><span id="tau"></span><br><span id="fps"></span></div>
<pre id="err"></pre>
<div id="boot"><div style="text-align:center">
  <div id="boottxt" data-i="booting">正在初始化着色器…</div>
  <div id="bootbtns">
    <button id="bretry" data-i="retry">重试</button>
    <button id="blite" class="pri" data-i="golite">以流畅模式进入</button>
  </div>
</div></div>
<div id="softwarn" style="display:none"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
function showErr(m){const e=$('err');e.style.display='block';e.textContent=m;}

/* ============================== i18n ============================== */
const STR={
zh:{appname:'天体模拟系统',subtitle:'广义相对论 · 引力透镜 · 爱因斯坦-罗森桥',
  helphint:'拖动旋转 · 滚轮缩放 · WASD 平移 · 点击选中星体',bodylist:'天体列表',lang:'语言 Language',
  metric:'黑洞度规',spin:'自旋 a',charge:'电荷 Q',resq:'渲染精度',steps:'光线步进',expo:'曝光',tscale:'时间流速',
  white:'白洞形态',bridge:'罗森桥',lite:'流畅模式',retry:'重试',golite:'以流畅模式进入',
  m0:'史瓦西',m1:'R-N',m2:'克尔',m3:'克尔-纽曼',
  satellite:'卫星',rocky:'岩质行星',gas:'气态巨行星',star:'恒星',wd:'白矮星',compact:'致密星',exit:'桥出口',bh:'黑洞',wh:'白洞',
  reset:'重置参数',aiintro:'AI 讲解',aititle:'AI 讲解员',aisource:'内置知识库 · 点 ⚙ 可连接在线模型',
  radius:'半径',orbitR:'轨道半径',orbitV:'公转速度',pulseF:'脉冲频率',exitap:'出口口径',
  horizon:'视界尺度',diskK:'发射环强度',tunerHint:'自旋 / 电荷 / 度规 → 左下控制台',surface:'表面色调',
  tau:'时间膨胀 τ=',booting:'正在初始化着色器…',bootfail:'着色器初始化失败，可选择下方方式进入',
  swauto:'已自动开启流畅模式 · 点此关闭',swoff:'检测到软件渲染 · 点此开启流畅模式',
  swfps:'帧率偏低 · 点此切换到流畅模式',
  endpoint:'API 地址',model:'模型名',apikey:'API 密钥',save:'保存',
  aisethint:'可选：填入 OpenAI 兼容接口后，AI 讲解改为实时生成；留空使用内置知识库。',
  aionlinefail:'（在线模型请求失败，已回退内置讲解）'},
en:{appname:'Celestial Simulator',subtitle:'General Relativity · Gravitational Lensing · Einstein–Rosen Bridge',
  helphint:'Drag to rotate · Scroll to zoom · WASD to pan · Click to select',bodylist:'Bodies',lang:'语言 Language',
  metric:'Metric',spin:'Spin a',charge:'Charge Q',resq:'Render scale',steps:'Ray steps',expo:'Exposure',tscale:'Time flow',
  white:'White hole',bridge:'Rosen bridge',lite:'Lite mode',retry:'Retry',golite:'Enter Lite mode',
  m0:'Schwarzschild',m1:'R–N',m2:'Kerr',m3:'Kerr–Newman',
  satellite:'Moon',rocky:'Rocky planet',gas:'Gas giant',star:'Star',wd:'White dwarf',compact:'Compact star',exit:'Bridge exit',bh:'Black hole',wh:'White hole',
  reset:'Reset params',aiintro:'AI Guide',aititle:'AI Guide',aisource:'Built-in knowledge base · ⚙ to connect an online model',
  radius:'Radius',orbitR:'Orbit radius',orbitV:'Orbit speed',pulseF:'Pulse freq',exitap:'Exit aperture',
  horizon:'Horizon scale',diskK:'Disk emission',tunerHint:'Spin / charge / metric → console below',surface:'Surface tint',
  tau:'Time dilation τ=',booting:'Initializing shaders…',bootfail:'Shader init failed — choose an entry below',
  swauto:'Lite mode enabled automatically · tap to disable',swoff:'Software rendering detected · tap to enable Lite mode',
  swfps:'Low FPS · tap to switch to Lite mode',
  endpoint:'API URL',model:'Model',apikey:'API key',save:'Save',
  aisethint:'Optional: fill in an OpenAI-compatible endpoint and AI Guide answers live; leave empty for the built-in knowledge base.',
  aionlinefail:'(online model failed; fell back to built-in guide)'}
};
let LANG=localStorage.getItem('cosmos_lang')||((navigator.language||'zh').toLowerCase().startsWith('zh')?'zh':'en');
const T=k=>(STR[LANG]&&STR[LANG][k])||STR.zh[k]||k;

/* ============================== bodies ============================== */
const TYPE_KEY=['rocky','gas','star','wd'];
const CAT=[
 {n:'太阳',en:'Sun',t:2,col:[1,.93,.78],r:6.0,orb:0,sp:0,ph:0},
 {n:'水星',en:'Mercury',t:0,col:[.60,.53,.46],r:.5,orb:16,sp:1.63,ph:.8},
 {n:'金星',en:'Venus',t:0,col:[.90,.80,.58],r:.92,orb:24,sp:1.17,ph:2.1},
 {n:'地球',en:'Earth',t:0,col:[.36,.56,.95],r:1.0,orb:34,sp:1.0,ph:4.2},
 {n:'月球',en:'Moon',t:0,col:[.76,.74,.71],r:.27,parent:3,orb:3.4,sp:4.2,ph:1},
 {n:'火星',en:'Mars',t:0,col:[.85,.44,.28],r:.64,orb:47,sp:.81,ph:5.3},
 {n:'木星',en:'Jupiter',t:1,col:[.84,.71,.54],r:3.0,orb:72,sp:.43,ph:1.4},
 {n:'土星',en:'Saturn',t:1,col:[.91,.82,.60],r:2.5,orb:98,sp:.32,ph:3.1,ring:1},
 {n:'天王星',en:'Uranus',t:1,col:[.58,.85,.88],r:1.7,orb:122,sp:.23,ph:.3},
 {n:'海王星',en:'Neptune',t:1,col:[.35,.48,.95],r:1.6,orb:144,sp:.18,ph:2.6},
 {n:'天狼星B',en:'Sirius B',t:3,col:[.78,.87,1],r:.85,orb:172,sp:.13,ph:5.9}
];
const NS={orb:205,sp:.10,ph:1.9};
const PRIM={orb:252,sp:.085,ph:4.4};
const EXIT={orb:300,sp:.06,ph:1.05};

const NSOL=CAT.length,NCOMP=3,MAXS=12;
const sPos=new Float32Array(MAXS*4),sCol=new Float32Array(MAXS*4);
const cPos=new Float32Array(NCOMP*4),cKey=new Float32Array(NCOMP*4);
let metric=2,white=false,bridge=false,spinA=.85,chgQ=0;
let nsR=.35,primScale=1,exitR=2.4,diskK=1,nsPulse=6;

function horizonR(){return Math.max(.45,1-.25*spinA*(white?0:1));}
function updateCompactKeys(){
  cKey[0]=white?1:0;cKey[1]=spinA;cKey[2]=chgQ;cKey[3]=1;
  cKey[4]=3;cKey[5]=0;cKey[6]=0;cKey[7]=1;
  cKey[8]=2;cKey[9]=0;cKey[10]=0;cKey[11]=bridge?1:0;
}
updateCompactKeys();

let bodyPos=CAT.map(()=>[0,0,0]);
function tickBodies(t){
  for(let i=0;i<CAT.length;i++){
    const b=CAT[i];let x=0,y=0,z=0;
    if(b.orb>0){
      const a=b.ph+t*b.sp;
      x=Math.cos(a)*b.orb;z=Math.sin(a)*b.orb;y=Math.sin(a*.9+b.ph)*b.orb*.03;
      if(b.parent!=null){const P=bodyPos[b.parent];x+=P[0];y+=P[1]+Math.sin(a)*b.orb*.04;z+=P[2];}
    }
    bodyPos[i]=[x,y,z];
  }
  const an=NS.ph+t*NS.sp;
  nsPos[0]=Math.cos(an)*NS.orb;nsPos[1]=Math.sin(an*.5)*6;nsPos[2]=Math.sin(an)*NS.orb;
  const ap=PRIM.ph+t*PRIM.sp;
  primPos[0]=Math.cos(ap)*PRIM.orb;primPos[1]=Math.sin(ap*.5)*10;primPos[2]=Math.sin(ap)*PRIM.orb;
  const ae=EXIT.ph+t*EXIT.sp;
  exitPos[0]=Math.cos(ae)*EXIT.orb;exitPos[1]=-14+Math.sin(ae*.5)*8;exitPos[2]=Math.sin(ae)*EXIT.orb;
}

function packScene(){
  for(let i=0;i<NSOL;i++){
    const b=CAT[i],p=bodyPos[i];
    sPos.set([p[0],p[1],p[2],b.r],i*4);
    sCol.set([b.col[0],b.col[1],b.col[2],b.t],i*4);
  }
  cPos.set([primPos[0],primPos[1],primPos[2],horizonR()*primScale],0);
  cPos.set([nsPos[0],nsPos[1],nsPos[2],nsR],4);
  cPos.set([exitPos[0],exitPos[1],exitPos[2],exitR],8);
}

/* ============================== GL init（三级降级保底） ============================== */
const cv=$('c');
const gl=cv.getContext('webgl',{antialias:false,depth:false,stencil:false,powerPreference:'high-performance'})
      ||cv.getContext('experimental-webgl');
let prog=null,fallbackMode=false,fatal=false;
function makeShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(s);gl.deleteShader(s);throw new Error(log||'shader compile failed');}
  return s;
}
function buildProgram(fs){
  const p=gl.createProgram();
  gl.attachShader(p,makeShader(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,makeShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){const log=gl.getProgramInfoLog(p);gl.deleteProgram(p);throw new Error(log||'link failed');}
  return p;
}
function fatalBoot(msg){
  fatal=true;
  $('boottxt').textContent=T('bootfail');
  $('bootbtns').style.display='flex';
  showErr(msg);
}
if(gl){
  try{ prog=buildProgram(FS1+'\n'+FS2); }
  catch(e1){
    try{ prog=buildProgram(FS_MINI); fallbackMode=true; console.warn('[cosmos] 主着色器失败，已切换精简渲染管线',e1); }
    catch(e2){ fatalBoot(String(e1)+'\n---\n'+String(e2)); }
  }
}else{ fatalBoot('WebGL 不可用 / WebGL unavailable'); }

let selB=0,selNS=false,selExit=false;
let yaw=0.6,pitch=0.42,distC=150,distS=150;
let tgt=[0,0,0],tgtS=[0,0,0];
let freePt=null,lastAct=performance.now();
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')closeAI();});

let drag=false,downX=0,downY=0,moved=0,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;downX=lx=e.clientX;downY=ly=e.clientY;cv.setPointerCapture(e.pointerId);lastAct=performance.now();});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  yaw-=dx*0.0045;
  pitch=Math.max(-1.35,Math.min(1.35,pitch-dy*0.0045));
  lastAct=performance.now();
});
cv.addEventListener('pointerup',e=>{
  drag=false;
  if(moved<6)pick(e.clientX,e.clientY);
});
addEventListener('wheel',e=>{
  e.preventDefault();
  distC=Math.max(2,Math.min(650,distC*Math.exp(e.deltaY*0.0011)));
  lastAct=performance.now();
},{passive:false});

function camBasis(){
  const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);
  const off=[distC*cp*sy,distC*sp,distC*cp*cy];
  const pos=[tgtS[0]+off[0],tgtS[1]+off[1],tgtS[2]+off[2]];
  let ww=[tgtS[0]-pos[0],tgtS[1]-pos[1],tgtS[2]-pos[2]];
  const wl=Math.hypot(...ww);ww=ww.map(x=>x/wl);
  let uu=[ww[2],0,-ww[0]];
  const ul=Math.hypot(...uu)||1;uu=uu.map(x=>x/ul);
  const vv=[ww[1]*uu[2]-ww[2]*uu[1],ww[2]*uu[0]-ww[0]*uu[2],ww[0]*uu[1]-ww[1]*uu[0]];
  return {pos,uu,vv,ww};
}
function project(pt,B){
  const rel=[pt[0]-B.pos[0],pt[1]-B.pos[1],pt[2]-B.pos[2]];
  const z=rel[0]*B.ww[0]+rel[1]*B.ww[1]+rel[2]*B.ww[2];
  if(z<0.5)return null;
  const x=(rel[0]*B.uu[0]+rel[1]*B.uu[1]+rel[2]*B.uu[2])/(1.6*z);
  const y=(rel[0]*B.vv[0]+rel[1]*B.vv[1]+rel[2]*B.vv[2])/(1.6*z);
  return [innerWidth/2+x*innerHeight/2,innerHeight/2-y*innerHeight/2,z];
}
function pick(mx,my){
  const B=camBasis();
  const cand=[];
  CAT.forEach((b,i)=>{const s=project(bodyPos[i],B);if(s)cand.push({s,i,kind:'b',r:b.r});});
  cands_compact(cand,B);
  let best=null,bd=1e9;
  for(const cd of cand){
    const d=Math.hypot(cd.s[0]-mx,cd.s[1]-my);
    const lim=Math.max(22,cd.r/(cd.s[2]*0.625)*innerHeight/2);
    if(d<lim&&d<bd){bd=d;best=cd;}
  }
  if(best)select(best.kind,best.i);
}
function cands_compact(cand,B){
  let s=project(primPos,B);if(s)cand.push({s,i:0,kind:'c',r:horizonR()*primScale});
  s=project(nsPos,B);if(s)cand.push({s,i:-1,kind:'n',r:nsR});
  if(bridge){s=project(exitPos,B);if(s)cand.push({s,i:-1,kind:'x',r:exitR});}
}

function select(kind,i){
  freePt=null;
  selNS=kind==='n';selExit=kind==='x';
  selB=kind==='b'?i:(kind==='c'?null:selB===null?0:selB);
  if(kind==='c')selB=null;
  const old=tgtS.slice();
  const nt=desiredTarget();
  const jump=Math.hypot(nt[0]-old[0],nt[1]-old[1],nt[2]-old[2]);
  distC+=Math.min(90,Math.max(10,jump*0.35));
  refreshUI();
  lastAct=performance.now();
}

function typewrite(el,text){

  if(RM){el.textContent=text;return;}
  let i=0;
  aiTimer=setInterval(()=>{

async function aiOnline(el,key,cfg){
  const sys=(LANG==='zh'
    ?'你是 Cosmos 天体模拟系统的讲解员，用简体中文向大众科普，回答不超过三段，生动、准确、紧扣主题对象。'
    :'You are the guide of the Cosmos simulator. Explain in English for a general audience, at most three short paragraphs, vivid and accurate.')+
   (LANG==='zh'?'当前讲解对象：':'Current subject: ')+aiName(key);
  const res=await fetch(cfg.url.replace(/\/+$/,'')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},
    signal:aiAbort.signal,
    body:JSON.stringify({model:cfg.model,stream:true,messages:[
      {role:'system',content:sys},
      {role:'user',content:(LANG==='zh'?'请介绍 ':'Please introduce ')+aiName(key)}
    ]})
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  const reader=res.body.getReader(),dec=new TextDecoder();
  let buf='';
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){
      const s=ln.trim();
      if(!s.startsWith('data:'))continue;
      const payload=s.slice(5).trim();
      if(payload==='[DONE]')continue;
      try{
        const j=JSON.parse(payload);
        const piece=j.choices&&j.choices[0]&&(j.choices[0].delta&&j.choices[0].delta.content||j.choices[0].message&&j.choices[0].message.content);
        if(piece){el.textContent+=piece;el.parentElement.scrollTop=el.parentElement.scrollHeight;}
      }catch(err){}
    }
  }
}

    infoEl.append(sliderRow(T('radius'),()=>nsR,v=>{nsR=v;},.15,.9,.01,fmt2));
    infoEl.append(sliderRow(T('orbitR'),()=>NS.orb,v=>{NS.orb=v;},120,300,1,fmt0));
    infoEl.append(sliderRow(T('orbitV'),()=>NS.sp,v=>{NS.sp=v;},.02,.5,.01,fmt2));
    infoEl.append(sliderRow(T('pulseF'),()=>nsPulse,v=>{nsPulse=v;},1,14,.5,fmt2));
    infoEl.append(resetBtn(()=>{nsR=DEFS.nsR;NS.orb=DEFS.nsOrb;NS.sp=DEFS.nsSp;nsPulse=DEFS.nsPulse;refreshUI();}));
  }else if(selExit){
    title=exitName();tp=T('exit');
    infoEl.append(el('h2',null,title),el('div','chip',tp));
    infoEl.append(sliderRow(T('exitap'),()=>exitR,v=>{exitR=v;},1,5,.05,fmt2));
    infoEl.append(resetBtn(()=>{exitR=DEFS.exitR;refreshUI();}));
  }else if(selB===null){
    title=primName();tp=primType();
    infoEl.append(el('h2',null,title),el('div','chip',tp));
    infoEl.append(sliderRow(T('horizon'),()=>primScale,v=>{primScale=v;},.6,2,.01,'×'+fmt2));
    infoEl.append(sliderRow(T('diskK'),()=>diskK,v=>{diskK=v;},0,1.6,.05,fmt2));
    infoEl.append(el('div','hint',T('tunerHint')));
    infoEl.append(resetBtn(()=>{primScale=DEFS.primScale;diskK=DEFS.diskK;refreshUI();}));
  }else{
    const b=CAT[selB];
    title=bname(b);tp=typeOf(b,selB);
    infoEl.append(el('h2',null,title),el('div','chip',tp));
    infoEl.append(sliderRow(T('radius'),()=>b.r,v=>{b.r=v;},.2,8,.05,fmt2));
    if(b.orb>0||selB!==0)infoEl.append(sliderRow(T('orbitR'),()=>b.orb,v=>{b.orb=v;},2,320,1,fmt0));
    if(b.sp)infoEl.append(sliderRow(T('orbitV'),()=>b.sp,v=>{b.sp=v;},0,3,.01,fmt2));
    if(selB!==0){
      infoEl.append(el('div','lbl','<span>'+T('surface')+'</span>'));
      infoEl.append(swatchRow(()=>b.col,v=>{b.col=v;sCol.set([v[0],v[1],v[2],b.t],selB*4);}));
    }
    infoEl.append(resetBtn(()=>{
      const d=DEFS.cat[selB];b.r=d.r;b.orb=d.orb;b.sp=d.sp;b.col=d.col.slice();
      sCol.set([...d.col,b.t],selB*4);refreshUI();
    }));
  }
  infoEl.append(aiBtn());
  infoEl.classList.remove('pop');void infoEl.offsetWidth;infoEl.classList.add('pop');
}
function refreshUI(){buildList();buildTuner();}

/* ============================== 控制台绑定 ============================== */
const mSeg=$('metric').querySelectorAll('button');
mSeg.forEach(btn=>btn.onclick=()=>{
  metric=+btn.dataset.m;
  mSeg.forEach(x=>x.classList.toggle('on',x===btn));
  $('mtag').textContent=metricName(metric);
  spinA=metric>=2?Math.max(spinA,.7):spinA;
  chgQ=metric===1||metric===3?Math.max(chgQ,.4):chgQ;
  $('spin').value=spinA;$('chg').value=chgQ;
  updateCompactKeys();refreshUI();
});
$('spin').oninput=e=>{spinA=+e.target.value;$('av').textContent=spinA.toFixed(2);updateCompactKeys();refreshUI();};
$('chg').oninput=e=>{chgQ=+e.target.value;$('qv').textContent=chgQ.toFixed(2);updateCompactKeys();refreshUI();};
$('resq').oninput=e=>{rscale=e.target.value/100;$('rv').textContent=e.target.value+'%';resize();};
$('steps').oninput=e=>{stepsCap=+e.target.value;$('sv').textContent=e.target.value;};
$('expo').oninput=e=>{$('ev').textContent=(e.target.value/100).toFixed(2);};
$('tscale').oninput=e=>{$('tv').textContent=(e.target.value/100).toFixed(1)+'×';};
$('twhite').onclick=()=>{
  white=!white;$('twhite').classList.toggle('on',white);
  updateCompactKeys();refreshUI();
};
$('tbridge').onclick=()=>{
  bridge=!bridge;$('tbridge').classList.toggle('on',bridge);
  updateCompactKeys();refreshUI();
};
$('bretry').onclick=()=>location.reload();
$('blite').onclick=()=>{sessionStorage.setItem('cosmos_forcelite','1');location.search='?lite=1';};

/* ============================== 软件渲染检测 ============================== */
try{
  const ext=gl.getExtension('WEBGL_debug_renderer_info');
  const rn=ext?String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)):'';
  if(/swiftshader|llvmpipe|software|basic render/i.test(rn)){
    if(!lite){softwarn(T('swoff'),()=>{lite=true;localStorage.setItem('cosmos_lite','1');applyLite(true,true);hideWarn();},true);}
  }
}catch(e){}

/* ============================== 主循环 ============================== */
const fpsEl=$('fps'),tauEl=$('tau'),bootEl=$('boot');
let firstDraw=false;
setTimeout(()=>{
  if(!firstDraw&&!fatal&&gl&&prog){
    $('boottxt').textContent=T('bootfail');
    $('bootbtns').style.display='flex';
  }
},9000);

const tscaleEl=$('tscale'),expoEl=$('expo');
const t0=performance.now();
let simT=0,frames=0,fpsT=t0,prev=t0;
function frame(now){
  const rdt=Math.min(0.05,(now-prev)/1000);prev=now;
  simT+=rdt*(+tscaleEl.value/100);
  tickBodies(simT);

  const des=desiredTarget(),desD=desiredDist();
  const kf=1-Math.exp(-rdt*6),kd=1-Math.exp(-rdt*2.1);
  tgtS[0]+=(des[0]-tgtS[0])*kf;tgtS[1]+=(des[1]-tgtS[1])*kf;tgtS[2]+=(des[2]-tgtS[2])*kf;
  distC+=(desD-distC)*(freePt?0:kd);

  if(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||keys.KeyQ||keys.KeyE){
    if(!freePt)freePt=tgtS.slice();
    const sp=distC*0.7*rdt;
    const fh=[-Math.sin(yaw),0,-Math.cos(yaw)];
    const rh=[Math.cos(yaw),0,-Math.sin(yaw)];
    let mv=[0,0,0];
    const acc=(v,k,s)=>{mv[0]+=v[0]*k*s;mv[1]+=v[1]*k*s;mv[2]+=v[2]*k*s;};
    acc(fh,(keys.KeyW?1:0)-(keys.KeyS?1:0),sp);
    acc(rh,(keys.KeyD?1:0)-(keys.KeyA?1:0),sp);
    mv[1]+=((keys.KeyE?1:0)-(keys.KeyQ?1:0))*sp;
    freePt[0]+=mv[0];freePt[1]+=mv[1];freePt[2]+=mv[2];
    lastAct=performance.now();
  }

  packScene();
  tgt=tgtS;
  const B=camBasis();
  if(!RM&&now-lastAct>5000&&!drag)yaw+=rdt*0.05;

  if(gl&&prog){
    if(fallbackMode){
      gl.uniform2f(U.uRes,cv.width,cv.height);
      gl.uniform1f(U.uTime,simT);
      gl.uniform3f(U.uCamPos,B.pos[0],B.pos[1],B.pos[2]);
      gl.uniformMatrix3fv(U.uCamMat,false,[...B.uu,...B.vv,...B.ww]);
      gl.uniform1f(U.uNs,NSOL);
      gl.uniform4fv(U.uSB,sPos);
      gl.uniform4fv(U.uSC,sCol);
    }else{
      gl.uniform2f(U.uRes,cv.width,cv.height);
      gl.uniform1f(U.uTime,simT);
      gl.uniform1f(U.uExp,+expoEl.value/100);
      gl.uniform1f(U.uTele,bridge?1:0);
      gl.uniform1f(U.uRingId,7);
      gl.uniform1f(U.uDiskK,diskK);
      gl.uniform1f(U.uPulse,nsPulse);
      gl.uniform1f(U.uStepsCap,stepsCap);
      gl.uniform1f(U.uLite,lite?1:0);
      gl.uniform3f(U.uCamPos,B.pos[0],B.pos[1],B.pos[2]);
      gl.uniformMatrix3fv(U.uCamMat,false,[...B.uu,...B.vv,...B.ww]);
      gl.uniform1f(U.uNs,NSOL);
      gl.uniform1f(U.uNc,NCOMP);
      gl.uniform4fv(U.uSB,sPos);
      gl.uniform4fv(U.uSC,sCol);
      gl.uniform4fv(U.uSP,cPos);
      gl.uniform4fv(U.uSK,cKey);
    }
    gl.drawArrays(gl.TRIANGLES,0,3);
    firstDraw=true;
  }
  const dPrim=Math.hypot(B.pos[0]-primPos[0],B.pos[1]-primPos[1],B.pos[2]-primPos[2]);
  const tau=Math.sqrt(Math.max(0,1-horizonR()/Math.max(dPrim,horizonR()+.01)));
  tauEl.textContent=T('tau')+tau.toFixed(4);
  frames++;
  if(now-fpsT>500){
    const fps=Math.round(frames*1000/(now-fpsT));
    fpsEl.innerHTML='<b>'+fps+'</b> FPS';
    frames=0;fpsT=now;
    if(bootEl.style.display!=='none'&&(firstDraw||fatal))bootEl.style.display='none';
    if(fps<22&&now-t0<9000&&!lite){
      if(rscale>0.105){
        rscale=Math.max(0.1,rscale-0.05);
        $('resq').value=Math.round(rscale*100);$('rv').textContent=Math.round(rscale*100)+'%';
        resize();
      }else if(stepsCap>40){
        stepsCap-=20;$('steps').value=stepsCap;$('sv').textContent=stepsCap;
      }
    }
    if(fps<20&&now-t0>12000&&!lite&&!liteOffered&&!fatal){
      liteOffered=true;
      softwarn(T('swfps'),()=>{lite=true;localStorage.setItem('cosmos_lite','1');applyLite(true,true);hideWarn();});
    }
  }
  requestAnimationFrame(frame);
}

/* ============================== 启动 ============================== */
applyLite(lite,true);
applyStatic();
refreshUI();
requestAnimationFrame(frame);
console.log('[cosmos] ready · v0.1.0 · lite='+lite+' fallback='+fallbackMode);
window.__cosmosReady=true;
</script>
</body>
</html>
